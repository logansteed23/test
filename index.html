<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Test Page</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f3f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
        padding: 48px 40px;
        border: 1px solid #e3e8f0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(31 41 55 / 8%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #4f46e5;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: -0.04em;
      }

      main > p:last-of-type {
        margin: 16px 0 28px;
        color: #64748b;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        background: #4338ca;
      }

      a:focus-visible {
        outline: 3px solid #a5b4fc;
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        main {
          padding: 36px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A little something to try</p>
      <h1>Hello, world!</h1>
      <p>This is a simple test webpage made with HTML and CSS. Change the text, colors, or styles to make it your own.</p>
      <a href="mailto:hello@example.com">Say hello</a>
    </main>
  </body>
</html>
